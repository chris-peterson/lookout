name: watch-self
filter: '\.claude/(?:lookout|claudewatch)\b|\boverrides\.py\b|\bunattended\.py\b|\bclaude\s+plugins?\b'
extensions: ['.json']

rules:
  block:
    - name: shell write to lookout state
      pattern: '>{1,2}\|?\s*["\x27]?[^\s;&|]*\.claude/(?:lookout|claudewatch)/|(?:^|[\s;&|`(])(?:rm|rmdir|mv|cp|tee|truncate|ln|install|unlink|sed\s+(?:-\S+\s+)*-i\S*|perl\s+-\S*i\S*)(?![\w-])[^\n;&|]*\.claude/(?:lookout|claudewatch)\b'
      reason: changes lookout's own rules or state; ask the user to make this change themselves
      ref: https://github.com/chris-peterson/lookout#self-protection

    - name: loosen an override
      pattern: '\boverrides\.py["\x27]?\s+(?:reset(?![\w-])|set\s[^\n;&|]*\s["\x27]?(?:ask|off)["\x27]?\s*(?=$|[;&|)`<>\n]))'
      reason: turns a lookout rule off or down a tier; ask the user to run this themselves
      ref: https://github.com/chris-peterson/lookout#self-protection

    - name: end unattended mode
      pattern: '\bunattended\.py["\x27]?\s+off(?![\w-])'
      reason: lifts the unattended block on asks; the user's next prompt ends unattended mode
      ref: https://github.com/chris-peterson/lookout#self-protection

    - name: disable the lookout plugin
      pattern: '(?:^|[\s;&|`(])claude\s+plugins?\s+(?:disable|uninstall|remove|rm)(?![\w-])[^\n;&|]*\b(?i:lookout|claudewatch)\b'
      reason: turns lookout off; ask the user to run this themselves
      ref: https://github.com/chris-peterson/lookout#self-protection

    - name: Write/Edit of lookout state
      pattern: '/\.claude/(?:lookout|claudewatch)/'
      target: file-path
      reason: changes lookout's own rules or state; ask the user to make this change themselves
      ref: https://github.com/chris-peterson/lookout#self-protection

    - name: settings that disable lookout
      pattern: '"(?i:lookout|claudewatch)@[^"]*"\s*:\s*false|"disableAllHooks"\s*:\s*true'
      target: file-content
      reason: a settings file that disables the lookout plugin or every hook; ask the user to make this change themselves
      ref: https://code.claude.com/docs/en/settings
